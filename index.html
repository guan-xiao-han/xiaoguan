        #search:focus {
            border-color: #667eea;

        }

        .clear-btn {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            width: 24px;
            height: 24px;
            border: none;
            background: #ddd;
            color: #fff;
            border-radius: 50%;
            cursor: pointer;
            font-size: 14px;
            line-height: 1;
            display: none;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }

        .clear-btn:hover {
            background: #bbb;
        }

        .clear-btn.show {
            display: flex;
        }

        #searchBtn {
            padding: 0 24px;
            font-size: 16px;
            font-weight: 600;
            color: #fff;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.15s, opacity 0.15s;
            white-space: nowrap;
        }

        #searchBtn:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(102, 126, 234, 0.4);
        }

        #searchBtn:active {
            transform: translateY(0);
            opacity: 0.9;
        }

        #result {
            max-height: 60vh;
            overflow-y: auto;
        }

        .card {
            border: 1px solid #eee;
            padding: 16px;
            margin: 12px 0;
            border-radius: 12px;
            background: #fafafa;
            transition: transform 0.15s, box-shadow 0.15s;
            animation: fadeIn 0.25s ease;
        }

        .card:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.08);
        }

        .card .question {
            font-size: 15px;
            color: #333;
            line-height: 1.5;
            font-weight: 600;
        }

        .card .answer {
            color: #16a34a;
            font-size: 16px;
            margin-top: 10px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .card .answer::before {
            content: "✓";
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 20px;
            height: 20px;
            background: #16a34a;
            color: #fff;
            border-radius: 50%;
            font-size: 12px;
            flex-shrink: 0;
        }

        .empty-tip {
            text-align: center;
            color: #999;
            padding: 40px 20px;
            font-size: 15px;
        }

        .empty-tip .icon {
            font-size: 40px;
            display: block;
            margin-bottom: 12px;
        }

        .count-tip {
            font-size: 13px;
            color: #999;
            margin-bottom: 10px;
            padding-left: 4px;
        }

        mark {
            background: #fef08a;
            color: inherit;
            padding: 0 2px;
            border-radius: 3px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        #result::-webkit-scrollbar {
            width: 6px;
        }
        #result::-webkit-scrollbar-thumb {
            background: #ccc;
            border-radius: 3px;
        }
        #result::-webkit-scrollbar-thumb:hover {
            background: #aaa;
        }

        @media (max-width: 480px) {
            body { padding: 10px; }

            #searchBtn { padding: 0 16px; font-size: 15px; }
            .card { padding: 14px; }
        }
    </style>
</head>

    const input = document.getElementById("search");
    const result = document.getElementById("result");
    const clearBtn = document.getElementById("clearBtn");
    const searchBtn = document.getElementById("searchBtn");

    // 初始化 Fuse（如果加载成功）
    let fuse = null;
    if (typeof Fuse !== 'undefined') {
        fuse = new Fuse(questions, {
            keys: ["q"],
            threshold: 0.4,
            ignoreLocation: true,
            includeScore: true,
            minMatchCharLength: 2,
        });
    }

    // 降级搜索：Fuse 不可用时，用简单的包含匹配
    function simpleSearch(keyword) {
        const kw = keyword.toLowerCase();
        const results = [];
        for (const item of questions) {
            const q = item.q.toLowerCase();
            if (q.includes(kw)) {
                // 完全包含，排前面
                results.push({ item, score: 0 });
            } else {
                // 逐字匹配：统计关键词中有多少字出现在题目里
                let hit = 0;
                for (const ch of kw) {
                    if (q.includes(ch)) hit++;
                }
                if (hit >= Math.max(1, Math.ceil(kw.length * 0.6))) {
                    results.push({ item, score: 1 - hit / kw.length });
                }
            }
        }
        results.sort((a, b) => a.score - b.score);
        return results;
    }

    function escapeHtml(str) {
        return String(str).replace(/[&<>"']/g, function (c) {
            return {'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c];
        });
    }

    function highlight(text, keyword) {
        const safeText = escapeHtml(text);
        if (!keyword) return safeText;
        const safeKeyword = keyword.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        try {
            const regex = new RegExp(`(${safeKeyword})`, 'gi');
            return safeText.replace(regex, '<mark>$1</mark>');
        } catch (e) {
            return safeText;
        }
    }

    function render(keyword) {
        if (!keyword) {
            result.innerHTML = "";
            clearBtn.classList.remove("show");
            return;
        }

        clearBtn.classList.add("show");

        let matches;
        if (fuse) {
            matches = fuse.search(keyword);
        } else {
            matches = simpleSearch(keyword);
        }
        matches = matches.slice(0, 50);

        if (matches.length === 0) {
            result.innerHTML = `
                <div class="empty-tip">
                    <span class="icon">🔍</span>
                  
                     没有找到相关题目，请换个关键词吧!
                 
                </div>`;
            return;
        }

        const countTip = `<div class="count-tip">共找到 ${matches.length} 条结果</div>`;
        const cards = matches.map(m => {
            const item = m.item;
            return `
            <div class="card">
                <div class="question">${highlight(item.q, keyword)}</div>
                <div class="answer">答案：${escapeHtml(item.answer)}</div>
            </div>`;
        }).join("");

        result.innerHTML = countTip + cards;
    }

    // 点击搜索按钮
    searchBtn.addEventListener("click", () => {
        render(input.value.trim());
    });

    // 清空按钮
    clearBtn.addEventListener("click", () => {
        input.value = "";
        input.focus();
        render("");
    });

    // 输入框有内容时显示清空按钮
    input.addEventListener("input", () => {
        if (input.value.trim()) {
            clearBtn.classList.add("show");
        } else {
            clearBtn.classList.remove("show");
            result.innerHTML = "";
        }
    });
</script>
